name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

version-resolver:
  major:
    labels:
      - 'breaking'
  minor:
    labels:
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'bug'
      - 'refactor'
      - 'documentation'
  default: patch

autolabeler:
  - label: 'feature'
    branch:
      - '/^feature\//'
    title:
      - '/^[Aa]dd/'
      - '/^[Ii]mplement/'
      - '/^[Cc]reate/'
  - label: 'bug'
    branch:
      - '/^bug\//'
      - '/^fix\//'
      - '/^hotfix\//'
    title:
      - '/^[Ff]ix/'
  - label: 'enhancement'
    branch:
      - '/^enhancement\//'
    title:
      - '/^[Uu]pdate/'
      - '/^[Ii]mprove/'
      - '/^[Uu]pgrade/'
      - '/^[Pp]in/'
  - label: 'refactor'
    branch:
      - '/^refactor\//'
    title:
      - '/^[Rr]efactor/'
      - '/^[Cc]lean/'
      - '/^[Mm]igrate/'
  - label: 'documentation'
    branch:
      - '/^docs\//'
    title:
      - '/^[Dd]ocument/'
      - '/^[Dd]ocs/'

categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
  - title: '✨ Enhancements'
    labels:
      - 'enhancement'
  - title: '🛠️ Refactors'
    labels:
      - 'refactor'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
  - title: '📚 Documentation'
    labels:
      - 'documentation'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'

no-changes-template: 'No changes in this release.'

# The image path is spelled out rather than built from $OWNER/$REPOSITORY:
# those keep the repository's original casing, and container references must
# be lowercase — `ghcr.io/PianoNic/BackroomsBaden` is rejected by the daemon.
template: |
  ## What's Changed

  $CHANGES

  ## Docker

  ```
  docker pull ghcr.io/pianonic/backroomsbaden:$RESOLVED_VERSION
  ```

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
