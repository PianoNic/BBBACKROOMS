name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install dependencies
        working-directory: server
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        working-directory: server
        run: pytest

  client:
    name: Client typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - name: Install dependencies
        working-directory: client
        run: bun install --frozen-lockfile

      # `bun run build` is `tsc -b && vite build`, so this covers both.
      - name: Typecheck and build
        working-directory: client
        run: bun run build

      # `--with-deps` runs apt-get, which refreshes every source on the runner
      # image — including Google's Chrome repo, whose index periodically fails
      # its own hash check and takes the whole step down with it. Nothing here
      # uses that repo (Playwright ships its own Chromium; --with-deps only
      # needs the Ubuntu archives), so drop it before installing.
      - name: Install Playwright browser
        working-directory: client
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          bunx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: client
        run: bun run test:e2e

  image:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only — proves the release build works without publishing.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
