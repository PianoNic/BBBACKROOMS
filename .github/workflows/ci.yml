name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install dependencies
        working-directory: server
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        working-directory: server
        run: pytest

  client:
    name: Client typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - name: Install dependencies
        working-directory: client
        run: bun install --frozen-lockfile

      - name: Unit tests
        working-directory: client
        run: bun run test:unit

      # `bun run build` is `tsc -b && vite build`, so this covers both.
      - name: Typecheck and build
        working-directory: client
        run: bun run build

      # `--with-deps` runs apt-get, which refreshes every source on the runner
      # image — including Google's Chrome repo, whose index periodically fails
      # its own hash check and takes the whole step down with it. Nothing here
      # uses that repo (Playwright ships its own Chromium; --with-deps only
      # needs the Ubuntu archives), so drop it before installing.
      - name: Install Playwright browser
        working-directory: client
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          bunx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: client
        run: bun run test:e2e

  live-e2e:
    name: Live end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        working-directory: server
        run: pip install -r requirements.txt

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - name: Install dependencies
        working-directory: client
        run: bun install --frozen-lockfile

      - name: Build client
        working-directory: client
        run: bun run build

      # `--with-deps` runs apt-get, which refreshes every source on the runner
      # image — including Google's Chrome repo, whose index periodically fails
      # its own hash check and takes the whole step down with it. Nothing here
      # uses that repo (Playwright ships its own Chromium; --with-deps only
      # needs the Ubuntu archives), so drop it before installing.
      - name: Install Playwright browser
        working-directory: client
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          bunx playwright install --with-deps chromium

      - name: Start the server
        working-directory: server
        env:
          NACHSITZEN_PORT: '8100'
          STATIC_DIR: ${{ github.workspace }}/client/dist
          FRONTEND_URL: http://127.0.0.1:8100
        run: |
          python -m app.asgi > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8100/healthz; then
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy in time"
          cat server.log
          exit 1

      - name: Live end-to-end tests
        working-directory: client
        env:
          LIVE_BASE_URL: http://127.0.0.1:8100
        run: bun run test:live

      - name: Print server log
        if: failure()
        working-directory: server
        run: cat server.log

  image:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Get build date
        id: build_date
        run: echo "BUILD_DATE=$(git log -1 --format=%cd --date=short)" >> "$GITHUB_OUTPUT"

      # Build only — proves the release build works without publishing.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          build-args: |
            BUILD_DATE=${{ steps.build_date.outputs.BUILD_DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
